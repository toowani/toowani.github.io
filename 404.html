<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Gothic+A1:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* GitHub Pages 404는 어떤 경로에서든 열리므로 상대경로 CSS 대신 자체 완결 스타일 */
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:#0c1b15; }
  body {
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.1rem;
    padding:2rem 1.25rem; text-align:center;
    background:linear-gradient(180deg,#0a1410 0%,#0c1b15 100%); color:#f1f7f2;
    font-family:"Gothic A1","Apple SD Gothic Neo",sans-serif; line-height:1.6;
  }
  body::before {
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 38% at 50% -6%, rgba(170,213,158,.2), transparent 60%),
               radial-gradient(ellipse 46% 30% at 90% 100%, rgba(170,213,158,.1), transparent 65%);
  }
  body > * { position:relative; z-index:1; }
  .eyebrow { font-size:.72rem; letter-spacing:.24em; text-transform:uppercase; color:#a9c9b3; font-weight:700; }
  h1 {
    font-family:"Baloo 2","Gothic A1",sans-serif; font-weight:800; font-size:clamp(5rem,18vw,9rem); line-height:1;
    background:linear-gradient(90deg,#aad59e,#cdeec0); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 22px rgba(170,213,158,.35));
  }
  pre { font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#a9c9b3; font-size:12px; line-height:1.3; }
  p { color:#a9c9b3; font-size:.9rem; }
  .btn {
    display:inline-flex; align-items:center; gap:.4rem; margin-top:.5rem;
    font-family:"Baloo 2","Gothic A1",sans-serif; font-weight:800; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase;
    color:#07130c; background:linear-gradient(90deg,#aad59e,#cdeec0); border-radius:999px; padding:.7rem 1.4rem; text-decoration:none;
    transition:box-shadow .2s ease, transform .15s ease;
  }
  .btn:hover { box-shadow:0 0 0 1px rgba(170,213,158,.42), 0 0 18px rgba(170,213,158,.25); transform:translateY(-1px); }
  .sub a { color:#cdeec0; text-decoration:none; border-bottom:1px solid transparent; }
  .sub a:hover { border-bottom-color:#cdeec0; }
</style>
</head>

  <span class="eyebrow">Page not found</span>
