<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="WANI.SYS — CONTEST RADAR">
<meta property="og:description" content="AI 공모전 · 개발 해커톤 · 창업 경진대회 마감일 레이더">

<meta name="theme-color" content="#0f0f0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<body>

<header id="hud">
  <div class="hud-left">
    <a href="../" id="logo">WANI.SYS</a>
    <span class="hud-sep">/</span>
    <span class="hud-page">CONTEST RADAR</span>
  </div>
  <div class="hud-actions">
    <button id="btn-export" class="hud-btn" title="관심·지원 상태를 JSON으로 내보내기">↓ 백업</button>
    <button id="btn-import" class="hud-btn" title="백업한 JSON 불러오기">↑ 복원</button>
    <input id="file-import" type="file" accept="application/json" hidden>
    <button id="btn-theme" class="hud-btn" title="라이트/다크 전환">◐ THEME</button>
  </div>
</header>

<section id="summary">
  <div class="stat"><span class="stat-n" id="st-open">–</span><span class="stat-l">접수중</span></div>
  <div class="stat urgent"><span class="stat-n" id="st-week">–</span><span class="stat-l">7일 내 마감</span></div>
  <div class="stat new"><span class="stat-n" id="st-new">–</span><span class="stat-l">지난 방문 후 신규</span></div>
  <div class="stat star"><span class="stat-n" id="st-star">–</span><span class="stat-l">관심</span></div>
  <div class="stat applied"><span class="stat-n" id="st-applied">–</span><span class="stat-l">지원함</span></div>
  <div class="meta">
    <div id="updated">불러오는 중…</div>
    <div id="sources-health" class="sources-health"></div>
  </div>
</section>

<section id="controls">
  <div class="row">
    <input id="q" type="search" placeholder="제목 · 주최 · 분야 검색  ( / 로 포커스 )" autocomplete="off">
    <select id="sort" title="정렬">
      <option value="deadline">마감 임박순</option>
      <option value="new">최근 등록순</option>
      <option value="start">접수 시작순</option>
      <option value="title">제목순</option>
    </select>
  </div>
  <div class="row chips" id="chips-cat" role="group" aria-label="분야">
    <span class="chips-label">분야</span>
    <button class="chip on" data-cat="ai">AI</button>
    <button class="chip on" data-cat="dev">해커톤 · 개발</button>
    <button class="chip on" data-cat="startup">창업</button>
    <button class="chip on" data-cat="video">AI 영상 · 콘텐츠</button>
  </div>
  <div class="row chips" id="chips-status" role="group" aria-label="상태">
    <span class="chips-label">상태</span>
    <button class="chip on" data-status="open">접수중</button>
    <button class="chip on" data-status="upcoming">접수 예정</button>
    <button class="chip" data-status="closed">마감됨</button>
    <span class="chips-gap"></span>
    <button class="chip" id="f-star">★ 관심만</button>
    <button class="chip" id="f-hide-applied">지원함 숨기기</button>
    <button class="chip" id="f-show-hidden">숨긴 항목 보기</button>
    <button class="chip" id="f-new">NEW만</button>
  </div>
  <div class="row chips" id="chips-src" role="group" aria-label="출처"></div>
</section>

<main id="list" aria-live="polite">
  <p class="empty-note">불러오는 중…</p>
</main>

</body>
